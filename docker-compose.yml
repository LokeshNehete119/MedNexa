services:
  # ────────────────────────────────────────────────────────────────────────────
  # Data Layer
  # ────────────────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: mednexa-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mednexa}
      POSTGRES_USER: ${POSTGRES_USER:-mednexa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mednexa_secret}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mednexa} -d ${POSTGRES_DB:-mednexa}"]
      interval: 3s
      timeout: 3s
      retries: 15
    restart: unless-stopped
    networks:
      - mednexa-net

  redis:
    image: redis:7-alpine
    container_name: mednexa-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - mednexa-net

  # ────────────────────────────────────────────────────────────────────────────
  # Database Migration Runner (Ephemeral Init Container - Task 5.1)
  # ────────────────────────────────────────────────────────────────────────────
  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mednexa-migration
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.seed"]
    environment:
      MEDNEXA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mednexa}:${POSTGRES_PASSWORD:-mednexa_secret}@db:5432/${POSTGRES_DB:-mednexa}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mednexa-net
    restart: "no"

  # ────────────────────────────────────────────────────────────────────────────
  # Application Services (Part 1 Backend API)
  # ────────────────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mednexa-api
    ports:
      - "8000:8000"
    environment:
      MEDNEXA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mednexa}:${POSTGRES_PASSWORD:-mednexa_secret}@db:5432/${POSTGRES_DB:-mednexa}
      MEDNEXA_REDIS_URL: redis://redis:6379/0
      MEDNEXA_JWT_SECRET: ${MEDNEXA_JWT_SECRET:-mednexa-super-secret-jwt-signing-key-32bytes-minimum}
      MEDNEXA_JWT_ALGORITHM: ${MEDNEXA_JWT_ALGORITHM:-HS256}
      MEDNEXA_JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${MEDNEXA_JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      MEDNEXA_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost:3001","http://127.0.0.1:3001"]'
      MEDNEXA_DEFAULT_COUNTRY_CODE: ${MEDNEXA_DEFAULT_COUNTRY_CODE:-91}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - mednexa-net

  # ────────────────────────────────────────────────────────────────────────────
  # Admin Dashboard UI (Part 4 Next.js 16)
  # ────────────────────────────────────────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    container_name: mednexa-dashboard
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-mednexa-dashboard-auth-secret}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mednexa-net

  # ────────────────────────────────────────────────────────────────────────────
  # Voice / Telephony Gateway (Part 3 + Part 2 Agent)
  # ────────────────────────────────────────────────────────────────────────────
  telephony:
    build:
      context: .
      dockerfile: telephony/Dockerfile
    container_name: mednexa-telephony
    ports:
      - "8001:8001"
    environment:
      MEDNEXA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mednexa}:${POSTGRES_PASSWORD:-mednexa_secret}@db:5432/${POSTGRES_DB:-mednexa}
      MEDNEXA_TEL_BACKEND_URL: http://api:8000
      MEDNEXA_TEL_HOSPITAL_ID: ${MEDNEXA_TEL_HOSPITAL_ID:-}
      MEDNEXA_TEL_TTS_ENGINE: ${MEDNEXA_TEL_TTS_ENGINE:-edge}
      MEDNEXA_TEL_WHISPER_MODEL_SIZE: ${MEDNEXA_TEL_WHISPER_MODEL_SIZE:-base}
      MEDNEXA_TEL_WHISPER_DEVICE: ${MEDNEXA_TEL_WHISPER_DEVICE:-cpu}
      MEDNEXA_AGENT_LLM_MODE: ${MEDNEXA_AGENT_LLM_MODE:-auto}
      MEDNEXA_AGENT_OLLAMA_URL: http://ollama:11434
      MEDNEXA_AGENT_LOCAL_MODEL: ${MEDNEXA_AGENT_LOCAL_MODEL:-llama3.1:8b}
      MEDNEXA_AGENT_CLOUD_PROVIDER: ${MEDNEXA_AGENT_CLOUD_PROVIDER:-groq}
      MEDNEXA_AGENT_CLOUD_MODEL: ${MEDNEXA_AGENT_CLOUD_MODEL:-llama-3.3-70b-versatile}
      MEDNEXA_AGENT_GROQ_API_KEY: ${MEDNEXA_AGENT_GROQ_API_KEY:-}
      MEDNEXA_AGENT_OPENAI_API_KEY: ${MEDNEXA_AGENT_OPENAI_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mednexa-net

  # ────────────────────────────────────────────────────────────────────────────
  # Local AI LLM Service (Ollama)
  # ────────────────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: mednexa-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    networks:
      - mednexa-net

volumes:
  pgdata:
  redisdata:
  ollama_models:

networks:
  mednexa-net:
    driver: bridge
