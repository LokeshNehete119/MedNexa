[project]
name = "mednexa-agent"
version = "0.1.0"
description = "MedNexa Part 2: LangGraph receptionist agent (LLM + tool calling)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mednexa-backend",
    "langgraph>=1.2",
    "langchain-core>=1.7",
    "langchain-ollama>=1.1",
    "langchain-groq>=1.1",
    "langchain-openai>=1.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.scripts]
mednexa-chat = "agent.chat:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.uv.sources]
# The agent's tools call Part 1's service layer directly (app.services.contracts).
mednexa-backend = { path = "../backend", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["agent"]
known-third-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
# Type-check against the backend source (installed as an editable path dependency).
mypy_path = "../backend"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# Import the backend from source even where .pth files are skipped (e.g. macOS hidden flag).
pythonpath = [".", "../backend"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["agent"]
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
