name: Agent CI

# Runs when the agent changes, or when backend code it depends on changes
# (the agent calls app.services directly and its tests use the backend migrations).
on:
  push:
    paths:
      - "agent/**"
      - "backend/app/**"
      - "backend/alembic/**"
  pull_request:
    paths:
      - "agent/**"
      - "backend/app/**"
      - "backend/alembic/**"
  workflow_dispatch:

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: agent

jobs:
  quality:
    name: Lint, format & types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy agent

  test:
    name: Tests (Postgres 16, scripted LLM)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mednexa
          POSTGRES_USER: mednexa
          POSTGRES_PASSWORD: mednexa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mednexa -d mednexa"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # The test suite creates this database if it doesn't exist.
      MEDNEXA_AGENT_TEST_DATABASE_URL: postgresql+asyncpg://mednexa:mednexa@localhost:5432/mednexa_agent_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests with coverage
        run: uv run pytest --cov --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-coverage
          path: agent/coverage.xml
          if-no-files-found: ignore
