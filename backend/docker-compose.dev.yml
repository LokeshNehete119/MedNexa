# Local Postgres for development and tests.
# Exposed on 5434 (localhost only) so it doesn't clash with other local Postgres instances.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mednexa
      POSTGRES_USER: mednexa
      POSTGRES_PASSWORD: mednexa
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mednexa -d mednexa"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
