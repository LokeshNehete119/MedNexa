[project]
name = "mednexa-telephony"
version = "0.1.0"
description = "MedNexa Part 3 -- Voice/Telephony pipeline (STT, TTS, VAD, call management)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Inter-package dependencies (Parts 1 & 2)
    "mednexa-agent",
    "mednexa-backend",

    # Web / async
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "websockets>=12.0",
    "python-multipart>=0.0.9",  # request.form() in the Twilio webhook

    # STT: Faster-Whisper (CTranslate2 backend)
    "faster-whisper>=1.0",

    # TTS: Edge-TTS (cloud free fallback; Piper installed as binary separately)
    "edge-tts>=6.1",

    # VAD: Silero via torch
    "torch>=2.2",
    "torchaudio>=2.2",

    # Audio processing
    "numpy>=1.26",
    "soundfile>=0.12",
    "pydub>=0.25",
    "aiofiles>=23.2",

    # Twilio (prototype telephony)
    "twilio>=9.0",

    # Config / settings
    "pydantic-settings>=2.3",
    "pydantic>=2.7",

    # Logging
    "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["telephony"]

[tool.uv.sources]
mednexa-agent = { path = "../agent", editable = true }
mednexa-backend = { path = "../backend", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest-mock>=3.14",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers"
